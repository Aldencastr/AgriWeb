<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d8a5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="200" fill="#10b981" opacity="0.1"/>
  <circle cx="150" cy="480" r="150" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="550" r="100" fill="#10b981" opacity="0.08"/>
  
  <!-- Logo/Icon area -->
  <g transform="translate(100, 120)">
    <!-- Seedling icon -->
    <circle cx="80" cy="80" r="70" fill="#ffffff" opacity="0.15"/>
    <path d="M80 20 C80 20, 50 40, 60 80 C70 120, 100 120, 100 80 C110 40, 80 20, 80 20" fill="#10b981"/>
    <path d="M80 80 L80 120" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="55" cy="60" rx="15" ry="8" fill="#10b981" opacity="0.7"/>
    <ellipse cx="105" cy="60" rx="15" ry="8" fill="#10b981" opacity="0.7"/>
  </g>
  
  <!-- Main content -->
  <text x="220" y="180" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Ingeniería Agrícola
  </text>
  <text x="220" y="250" font-family="system-ui, sans-serif" font-size="28" font-weight="500" fill="#d1fae5">
    Universidad Nacional de Ingeniería
  </text>
  
  <!-- Tagline -->
  <text x="220" y="350" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#a7f3d0">
    Cultivamos innovación para alimentar el futuro
  </text>
  
  <!-- Features -->
  <g transform="translate(220, 420)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#ffffff">🌱  Plan 2026  •  5 Años  •  10 Semestres</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#ffffff">💧  Riego  •  🚜  Maquinaria  •  📊  Datos  •  🗺️  GIS</text>
    <text x="0" y="70" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#ffffff">🌿  Sostenibilidad  •  🚀  Emprendimiento AgTech</text>
  </g>
  
  <!-- CTA -->
  <rect x="220" y="520" width="280" height="56" rx="28" fill="url(#accent)"/>
  <text x="360" y="558" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#022c22" text-anchor="middle">
    Explorar carrera →
  </text>
  
  <!-- Bottom brand -->
  <text x="100" y="600" font-family="system-ui, sans-serif" font-size="14" fill="#ffffff" opacity="0.6">
    agriweb.example.com  |  Ingeniería Agrícola UNI
  </text>
</svg>